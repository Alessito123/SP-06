name: Scientific reproducibility
on:
  push:
    branches: [research/rpmesp-audit-20261123]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      PYTHONHASHSEED: '606'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
          cache: pip
          cache-dependency-path: sp06_crisp/science/dependencies.lock.txt
      - name: Install frozen research environment
        run: python -m pip install -r sp06_crisp/science/research.requirements.txt -c sp06_crisp/science/dependencies.lock.txt
      - name: Check dependency resolution
        run: python -m pip check
      - name: Scientific unit and integration tests
        run: python -m unittest discover -s sp06_crisp -p "test_*.py" -v
